<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM 2026.2 — Painel do Organizador</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
    }
    .container {
      text-align: center;
    }
    .spinner {
      border: 4px solid #2563EB;
      border-top: 4px solid transparent;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <p>Carregando Painel do Organizador...</p>
  </div>

  <script>
    // Redireciona para o Google Apps Script com modo admin
    window.location.href = "https://script.google.com/macros/s/AKfycbwrQPgGKBaUpmzB8rCLDKBgF7nFJiv8kFjq3v7l2xg/exec?modo=admin";
  </script>
</body>
</html>
