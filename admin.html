<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM 2026.2 — Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-cacique { background-color: #0F172A; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="bg-cacique text-white shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center font-bold text-xl">
          <i class="fas fa-trophy"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-wide">JIM 2026.2 — AAAMCTN</h1>
          <p class="text-xs text-gray-400">Painel do Organizador</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs bg-red-600 px-3 py-1 rounded-full font-bold">ADMIN</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h2 class="text-lg font-bold text-gray-900">Confrontos</h2>
          <p class="text-sm text-gray-500">Visualização dos jogos com status, placar e local.</p>
        </div>
        <div class="w-full md:w-72">
          <select id="selectModalidade" onchange="renderJogos()" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm font-semibold text-gray-700">
            <option value="Todas">Todas as Modalidades</option>
            <option value="Futebol Sete Masc">Futebol Sete Masc</option>
            <option value="Futebol Sete Fem">Futebol Sete Fem</option>
            <option value="Vôlei Masc">Vôlei Masc</option>
            <option value="Vôlei Fem">Vôlei Fem</option>
            <option value="Beach Tennis">Beach Tennis</option>
            <option value="Tênis Masc">Tênis Masc</option>
            <option value="Tênis Fem">Tênis Fem</option>
            <option value="Sinuca">Sinuca</option>
            <option value="Pebolim">Pebolim</option>
            <option value="FIFA">FIFA</option>
            <option value="Xadrez">Xadrez</option>
            <option value="Truco Gaudério">Truco Gaudério</option>
            <option value="Truco Paulista">Truco Paulista</option>
            <option value="Jogos Alcoólicos">Jogos Alcoólicos</option>
          </select>
        </div>
      </div>
    </section>

    <section>
      <div id="listaJogos" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwltAE6CbhINH_jf3S00QrXg05R_Ubz-eDOmKtY338vBkAf8hf4iJ46o47KGiGF17JM/exec?modo=json";
    let jogosData = [];

    async function carregarJogos() {
      try {
        const resp = await fetch(API_URL, { cache: "no-store" });
        const data = await resp.json();
        jogosData = data.jogos || [];
        renderJogos();
      } catch (err) {
        console.error("Erro ao carregar jogos:", err);
        document.getElementById("listaJogos").innerHTML = `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-red-200 text-red-700">
            Erro ao carregar jogos.
          </div>
        `;
      }
    }

    function renderJogos() {
      const container = document.getElementById("listaJogos");
      const modalidadeSel = document.getElementById("selectModalidade").value;
      container.innerHTML = "";

      const jogosFiltrados = jogosData.filter(j => modalidadeSel === "Todas" || j.modalidade === modalidadeSel);

      if (!jogosFiltrados.length) {
        container.innerHTML = `<div class="bg-white p-4 rounded-xl shadow-sm border text-gray-500">Nenhum jogo encontrado.</div>`;
        return;
      }

      jogosFiltrados.forEach(j => {
        const enc = j.status === "Encerrado";
        const aoVivo = j.status === "Em Andamento";

        const card = document.createElement("div");
        card.className = `bg-white p-4 rounded-xl shadow-sm border ${aoVivo ? 'border-red-400 bg-red-50' : 'border-gray-200'}`;

        card.innerHTML = `
          <div class="flex justify-between items-center mb-3">
            <div>
              <span class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-1 rounded mr-2">${j.modalidade}</span>
              <span class="text-xs font-medium text-gray-500">${j.fase || ''}${j.horario ? ' • ' + j.horario : ''}${j.local ? ' • ' + j.local : ''}</span>
            </div>
            <span class="text-xs font-semibold px-2 py-1 rounded ${aoVivo ? 'text-red-700 bg-red-100' : (enc ? 'text-green-700 bg-green-100' : 'text-amber-700 bg-amber-100')}">
              ${aoVivo ? 'AO VIVO' : (enc ? 'Encerrado' : 'Acontecerá')}
            </span>
          </div>

          <div class="mb-3 grid grid-cols-3 gap-2 items-center bg-gray-50 p-3 rounded-lg">
            <div class="font-bold text-sm text-center">${j.t1}</div>
            <div class="flex items-center justify-center gap-2">
              <span class="font-bold text-lg">${j.p1}</span>
              <span class="text-gray-400">x</span>
              <span class="font-bold text-lg">${j.p2}</span>
            </div>
            <div class="font-bold text-sm text-center">${j.t2}</div>
          </div>

          <div class="flex justify-between items-center text-xs text-gray-500">
            <span>Local: ${j.local || '—'}</span>
            <span>ID: ${j.id}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    carregarJogos();
    setInterval(carregarJogos, 10000);
  </script>
</body>
</html>
