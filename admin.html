<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM 2026.2 — Painel do Organizador</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
    }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100vh;
      background-color: #0f172a;
      color: white;
      font-family: Arial, sans-serif;
      flex-direction: column;
      gap: 20px;
    }
    .spinner {
      border: 4px solid #2563EB;
      border-top: 4px solid transparent;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Carregando Painel do Organizador...</p>
  </div>

  <iframe 
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbwltAE6CbhINH_jf3S00QrXg05R_Ubz-eDOmKtY338vBkAf8hf4iJ46o47KGiGF17JM/exec?modo=admin"
    sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-modals allow-presentation"
    title="JIM 2026.2 — Painel do Organizador"
    onload="document.getElementById('loading').style.display='none'; document.getElementById('appFrame').style.display='block';"
    style="display: none;">
  </iframe>

  <script>
    setTimeout(() => {
      if (document.getElementById('appFrame').style.display === 'none') {
        document.getElementById('loading').innerHTML = `
          <p style="color: #ff6b6b; text-align: center;">
            ⚠️ Erro ao carregar o painel<br>
            Verifique sua conexão e tente novamente
          </p>
        `;
      }
    }, 10000);
  </script>

</body>
</html>
