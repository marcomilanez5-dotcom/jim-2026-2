<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM 2026.2 — Placar do Bar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #050814;
      color: #FFFFFF;
      overflow-x: hidden;
    }
    .neon-gold {
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.6);
    }
    .linha-lider {
      background: linear-gradient(90deg, rgba(245, 158, 11, 0.25) 0%, rgba(245, 158, 11, 0.05) 100%);
      border: 2px solid #F59E0B;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 flex flex-col justify-between max-w-5xl mx-auto">

  <!-- CABEÇALHO DA TV -->
  <header class="flex justify-between items-center border-b border-neutral-800 pb-3 mb-4">
    <div class="flex items-center gap-3">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 text-slate-950 flex items-center justify-center text-2xl font-black shadow-lg">
        <i class="fas fa-beer"></i>
      </div>
      <div>
        <h1 class="text-xl sm:text-2xl font-black tracking-wider text-amber-400 neon-gold">
          TROFÉU ETÍLICO — JIM 2026.2
        </h1>
        <p class="text-xs text-neutral-400 font-bold uppercase tracking-widest">
          Classificação Oficial de Consumo no Bar
        </p>
      </div>
    </div>

    <!-- RELÓGIO & STATUS -->
    <div class="text-right">
      <span id="relogioTv" class="text-xl font-black text-white block leading-none">--:--</span>
      <span class="text-[10px] text-green-400 font-bold uppercase tracking-widest flex items-center gap-1 justify-end mt-1">
        <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
        AO VIVO
      </span>
    </div>
  </header>

  <!-- LISTA DE CLASSIFICAÇÃO (TABELA VERTICAL) -->
  <main class="flex-1 space-y-2">
    
    <!-- CABEÇALHO DA LISTA -->
    <div class="grid grid-cols-12 gap-2 px-4 py-2 text-[11px] font-black uppercase tracking-wider text-neutral-400 border-b border-neutral-800">
      <div class="col-span-2 sm:col-span-1 text-center">POS</div>
      <div class="col-span-5 sm:col-span-6">TURMA</div>
      <div class="col-span-2 text-center hidden sm:block">COMBOS</div>
      <div class="col-span-5 sm:col-span-3 text-right">PONTUAÇÃO</div>
    </div>

    <!-- CONTAINER DAS LINHAS -->
    <div id="listaRankingBar" class="space-y-2">
      <!-- Preenchido via JavaScript -->
    </div>

  </main>

  <!-- RODAPÉ DISCRETO -->
  <footer class="mt-4 pt-3 border-t border-neutral-800/80 flex justify-between items-center text-xs text-neutral-500 font-semibold">
    <span>Atualização automática a cada 8s</span>
    <span>AAAMCTN • Beba com moderação</span>
  </footer>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwltAE6CbhINH_jf3S00QrXg05R_Ubz-eDOmKtY338vBkAf8hf4iJ46o47KGiGF17JM/exec?modo=json";

    function atualizarRelogio() {
      const agora = new Date();
      const h = String(agora.getHours()).padStart(2, '0');
      const m = String(agora.getMinutes()).padStart(2, '0');
      const s = String(agora.getSeconds()).padStart(2, '0');
      document.getElementById("relogioTv").innerText = `${h}:${m}:${s}`;
    }

    async function buscarDadosTelao() {
      try {
        const resp = await fetch(API_URL, { cache: "no-store" });
        const data = await resp.json();
        const lista = data.rankingBar || [];
        renderizarListaBar(lista);
      } catch (err) {
        console.error("Erro no telão:", err);
      }
    }

    function renderizarListaBar(lista) {
      const container = document.getElementById("listaRankingBar");
      if (!lista || lista.length === 0) return;

      container.innerHTML = "";

      lista.forEach((r, idx) => {
        const posicao = idx + 1;
        const ehLider = (posicao === 1);
        const ehSegundo = (posicao === 2);
        const ehTerceiro = (posicao === 3);

        // Estilos e Medalhas
        let estiloLinha = "bg-neutral-900/70 border border-neutral-800";
        let iconePos = `${posicao}º`;
        let corPontos = "text-amber-400";
        let corTurma = "text-white";

        if (ehLider) {
          estiloLinha = "linha-lider shadow-lg";
          iconePos = "👑 1º";
          corPontos = "text-yellow-400 font-black text-xl sm:text-2xl";
          corTurma = "text-yellow-300 font-black text-lg sm:text-xl";
        } else if (ehSegundo) {
          estiloLinha = "bg-neutral-900/90 border border-slate-500/50";
          iconePos = "🥈 2º";
          corPontos = "text-slate-200 font-black text-lg sm:text-xl";
        } else if (ehTerceiro) {
          estiloLinha = "bg-neutral-900/80 border border-amber-800/50";
          iconePos = "🥉 3º";
          corPontos = "text-amber-500 font-black text-lg sm:text-xl";
        }

        container.innerHTML += `
          <div class="grid grid-cols-12 gap-2 items-center px-4 py-3 rounded-2xl ${estiloLinha} transition-all">
            <!-- POSIÇÃO -->
            <div class="col-span-2 sm:col-span-1 text-center font-black text-sm sm:text-base text-neutral-300">
              ${iconePos}
            </div>

            <!-- TURMA -->
            <div class="col-span-5 sm:col-span-6 flex items-center gap-2">
              <span class="font-black ${corTurma}">Turma ${r.turma}</span>
              ${ehLider ? '<span class="hidden sm:inline bg-amber-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider">Líder</span>' : ''}
            </div>

            <!-- COMBOS -->
            <div class="col-span-2 text-center hidden sm:block font-bold text-sm text-neutral-400">
              ${r.combos || 0} <span class="text-[10px] text-neutral-600">combos</span>
            </div>

            <!-- PONTUAÇÃO -->
            <div class="col-span-5 sm:col-span-3 text-right">
              <span class="${corPontos}">${r.pontos || 0}</span>
              <span class="text-xs font-bold text-neutral-400 uppercase ml-1">pts</span>
            </div>
          </div>
        `;
      });
    }

    // Inicialização
    setInterval(atualizarRelogio, 1000);
    atualizarRelogio();
    buscarDadosTelao();
    setInterval(buscarDadosTelao, 8000); // Atualiza os pontos a cada 8 segundos
  </script>
</body>
</html>
