<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM 2026.2 — Central do Torcedor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-cacique { background-color: #0F172A; }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-live { animation: pulse-red 1.5s infinite; }
    .badge-novo { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .jogo-destaque {
      border: 2px solid #FCD34D !important;
      background-color: #FFFBEB !important;
      box-shadow: 0 0 10px rgba(252, 211, 77, 0.3);
    }
    .vitoria {
      background-color: #DCFCE7 !important;
      border-color: #22C55E !important;
    }
    .derrota {
      background-color: #FEE2E2 !important;
      border-color: #EF4444 !important;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

  <header class="bg-cacique text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fas fa-trophy text-yellow-400 text-xl"></i>
        <div>
          <h1 class="text-lg font-bold tracking-wide leading-none">JIM 2026.2 — AAAMCTN</h1>
          <p class="text-xs text-gray-400">Acompanhamento Ao Vivo</p>
        </div>
      </div>
      <div class="text-right text-xs text-gray-300 flex items-center gap-2">
        <span class="hidden sm:inline">🔄 Atualização contínua</span>
        <i class="fas fa-sync-alt fa-spin text-blue-400"></i>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- PRÓXIMOS JOGOS -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-sm font-bold uppercase tracking-wider text-gray-700 mb-3 flex items-center gap-2">
        <i class="fas fa-clock"></i> Próximos Jogos da Sua Turma
      </h2>
      <div id="proximosJogos" class="space-y-2">
        <p class="text-gray-500 text-sm">Selecione sua turma para ver próximos jogos</p>
      </div>
    </section>

    <!-- JOGOS AO VIVO -->
    <section id="secaoAoVivo" class="hidden">
      <div class="bg-red-50 border border-red-200 rounded-xl p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-3 h-3 bg-red-600 rounded-full pulse-live"></span>
          <h2 class="text-sm font-bold uppercase tracking-wider text-red-700">Acontecendo Agora</h2>
        </div>
        <div id="cardsAoVivo" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Filtrar Confrontos</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Modalidade</label>
          <select id="filterModalidade" onchange="renderAll()" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm font-semibold text-gray-800">
            <option value="Todas">Todas as Modalidades</option>
            <option value="Futebol Sete Masc">Futebol Sete Masc</option>
            <option value="Futebol Sete Fem">Futebol Sete Fem</option>
            <option value="Vôlei Masc">Vôlei Masc</option>
            <option value="Vôlei Fem">Vôlei Fem</option>
            <option value="Beach Tennis">Beach Tennis</option>
            <option value="Tênis Masc">Tênis Masc</option>
            <option value="Tênis Fem">Tênis Fem</option>
            <option value="Sinuca">Sinuca</option>
            <option value="Pebolim">Pebolim</option>
            <option value="FIFA">FIFA</option>
            <option value="Xadrez">Xadrez</option>
            <option value="Truco Gaudério">Truco Gaudério</option>
            <option value="Truco Paulista">Truco Paulista</option>
            <option value="Jogos Alcoólicos">Jogos Alcoólicos</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Sua Turma</label>
          <select id="filterTurma" onchange="salvarTurmaLocal(); renderAll()" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm font-semibold text-gray-800 border-blue-400">
            <option value="Todas">Todas as Turmas</option>
            <option value="46">Turma 46</option>
            <option value="47A">Turma 47A</option>
            <option value="47B">Turma 47B</option>
            <option value="47C">Turma 47C</option>
            <option value="48A">Turma 48A</option>
            <option value="48B">Turma 48B</option>
            <option value="48C">Turma 48C</option>
            <option value="49A">Turma 49A</option>
            <option value="49B">Turma 49B</option>
            <option value="49C">Turma 49C</option>
            <option value="50A">Turma 50A</option>
            <option value="50B">Turma 50B</option>
            <option value="50C">Turma 50C</option>
          </select>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 pt-1">
        <button onclick="setDia('Todos')" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white">Todos os Dias</button>
        <button onclick="setDia('Quinta')" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Quinta</button>
        <button onclick="setDia('Sexta')" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Sexta</button>
        <button onclick="setDia('Sábado')" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Sábado</button>
        <button onclick="setDia('Domingo')" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Domingo</button>
      </div>
    </section>

    <!-- LISTA DE JOGOS -->
    <section>
      <div id="listaJogos" class="grid grid-cols-1 gap-3"></div>
    </section>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwltAE6CbhINH_jf3S00QrXg05R_Ubz-eDOmKtY338vBkAf8hf4iJ46o47KGiGF17JM/exec?modo=json";
    let jogosData = [];
    let diaSelecionado = "Todos";
    let turmaLocal = localStorage.getItem('jimTurma') || "Todas";
    let carregando = false;

    async function carregarJogos() {
      if (carregando) return;
      carregando = true;
      try {
        const resp = await fetch(API_URL, { cache: "no-store" });
        const data = await resp.json();
        jogosData = data.jogos || [];
        renderAll();
      } catch (err) {
        console.error("Erro ao carregar jogos:", err);
      } finally {
        carregando = false;
      }
    }

    function salvarTurmaLocal() {
      const turma = document.getElementById("filterTurma").value;
      localStorage.setItem('jimTurma', turma);
      turmaLocal = turma;
    }

    function carregarTurmaLocal() {
      const turma = localStorage.getItem('jimTurma');
      if (turma) {
        document.getElementById("filterTurma").value = turma;
        turmaLocal = turma;
      }
    }

    function setDia(dia) {
      diaSelecionado = dia;
      document.querySelectorAll(".btn-dia").forEach(btn => {
        if(btn.innerText.includes(dia)) {
          btn.className = "btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white";
        } else {
          btn.className = "btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200";
        }
      });
      renderAll();
    }

    function renderAll() {
      renderAoVivo();
      renderProximosJogos();
      renderJogos();
    }

    function renderProximosJogos() {
      const container = document.getElementById("proximosJogos");
      container.innerHTML = "";
      if (turmaLocal === "Todas") {
        container.innerHTML = "<p class='text-gray-500 text-sm'>Selecione sua turma para ver próximos jogos</p>";
        return;
      }
      const proximosJogos = jogosData.filter(j => {
        const t1 = String(j.t1).trim().toLowerCase();
        const t2 = String(j.t2).trim().toLowerCase();
        const turmaBusca = String(turmaLocal).trim().toLowerCase();
        const isMinhaTurma = t1 === turmaBusca || t2 === turmaBusca || t1.includes(turmaBusca) || t2.includes(turmaBusca);
        return isMinhaTurma && (j.status === "Acontecerá" || j.status === "Em breve");
      }).slice(0, 3);

      if (proximosJogos.length === 0) {
        container.innerHTML = "<p class='text-gray-500 text-sm'>Nenhum jogo agendado</p>";
        return;
      }

      proximosJogos.forEach(j => {
        const card = document.createElement("div");
        card.className = "bg-gradient-to-r from-blue-50 to-blue-100 border border-blue-300 p-3 rounded-lg";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-sm text-blue-900">${j.modalidade}</span>
            <span class="text-xs text-blue-700">${j.horario || "A definir"}${j.local ? " • " + j.local : ""}</span>
          </div>
          <div class="flex items-center justify-between">
            <div class="font-bold text-sm">${j.t1}</div>
            <div class="text-xs text-gray-600">vs</div>
            <div class="font-bold text-sm">${j.t2}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderAoVivo() {
      const container = document.getElementById("cardsAoVivo");
      const secao = document.getElementById("secaoAoVivo");
      container.innerHTML = "";
      const emAndamento = jogosData.filter(j => j.status === "Em Andamento" || j.status === "Ao Vivo");
      if (emAndamento.length > 0) {
        secao.classList.remove("hidden");
        emAndamento.forEach(j => {
          container.appendChild(criarCardJogo(j, true));
        });
      } else {
        secao.classList.add("hidden");
      }
    }

    function renderJogos() {
      const container = document.getElementById("listaJogos");
      const mod = document.getElementById("filterModalidade").value;
      container.innerHTML = "";
      const jogosFiltrados = jogosData.filter(j => {
        const matchMod = mod === "Todas" || j.modalidade === mod;
        const t1Str = String(j.t1 || "").trim().toLowerCase();
        const t2Str = String(j.t2 || "").trim().toLowerCase();
        const turmaBusca = String(turmaLocal).trim().toLowerCase();
        const matchTurma = turmaLocal === "Todas" || t1Str === turmaBusca || t2Str === turmaBusca || t1Str.includes(turmaBusca) || t2Str.includes(turmaBusca);
        const matchDia = diaSelecionado === "Todos" || (j.horario && String(j.horario).toLowerCase().includes(diaSelecionado.toLowerCase()));
        return matchMod && matchTurma && matchDia;
      });
      if (!jogosFiltrados.length) {
        container.innerHTML = `<div class="text-center text-gray-500 py-10 bg-white rounded-xl shadow-sm border">Nenhum jogo encontrado.</div>`;
        return;
      }
      jogosFiltrados.forEach(j => {
        container.appendChild(criarCardJogo(j, false));
      });
    }

    function criarCardJogo(j, isLive) {
      const enc = j.status === 'Encerrado';
      const aoVivo = j.status === 'Em Andamento' || j.status === 'Ao Vivo';
      const win1 = enc && j.p1 > j.p2;
      const win2 = enc && j.p2 > j.p1;
      const t1Str = String(j.t1).trim().toLowerCase();
      const t2Str = String(j.t2).trim().toLowerCase();
      const turmaBusca = String(turmaLocal).trim().toLowerCase();
      const isMinhaTurma = turmaLocal !== "Todas" && (t1Str === turmaBusca || t2Str === turmaBusca || t1Str.includes(turmaBusca) || t2Str.includes(turmaBusca));

      let classDestaque = "";
      if (aoVivo) classDestaque = "border-red-400 bg-red-50";
      else if (isMinhaTurma && enc && win1) classDestaque = "vitoria jogo-destaque";
      else if (isMinhaTurma && enc && win2) classDestaque = "derrota jogo-destaque";
      else if (isMinhaTurma) classDestaque = "jogo-destaque";

      const card = document.createElement("div");
      card.className = `bg-white p-4 rounded-xl shadow-sm border border-gray-200 ${classDestaque}`;

      let badgeNovo = "";
      if (aoVivo) {
        badgeNovo = `<span class="badge-novo text-xs font-bold bg-red-500 text-white px-2 py-1 rounded-full ml-2">🔴 AO VIVO</span>`;
      } else if (enc) {
        badgeNovo = `<span class="badge-novo text-xs font-bold bg-green-500 text-white px-2 py-1 rounded-full ml-2">✓ RESULTADO NOVO</span>`;
      }

      card.innerHTML = `
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md">${j.modalidade}</span>
          <div class="flex items-center">
            <span class="text-xs font-semibold ${aoVivo ? 'text-red-600 bg-red-50 px-2 py-0.5 rounded' : (enc ? 'text-green-600 bg-green-50 px-2 py-0.5 rounded' : 'text-amber-600 bg-amber-50 px-2 py-0.5 rounded')}">
              ${aoVivo ? 'AO VIVO' : (enc ? 'Encerrado' : (j.horario || 'Em breve'))}
            </span>
            ${j.local ? `<span class="text-xs text-gray-500 ml-2"><i class="fas fa-map-marker-alt mr-1"></i>${j.local}</span>` : ''}
            ${badgeNovo}
          </div>
        </div>
        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg mt-2">
          <div class="w-5/12 text-center font-bold text-sm ${win1 ? 'text-green-700 font-extrabold' : 'text-gray-800'}">
            ${win1 ? '<i class="fas fa-trophy text-yellow-500 mr-1"></i>' : ''} ${j.t1}
          </div>
          <div class="w-2/12 flex items-center justify-center gap-1.5 font-extrabold text-lg">
            <span class="${win1 ? 'text-green-600 text-xl' : 'text-gray-700'}">${j.p1}</span>
            <span class="text-gray-400 font-normal">x</span>
            <span class="${win2 ? 'text-green-600 text-xl' : 'text-gray-700'}">${j.p2}</span>
          </div>
          <div class="w-5/12 text-center font-bold text-sm ${win2 ? 'text-green-700 font-extrabold' : 'text-gray-800'}">
            ${j.t2} ${win2 ? '<i class="fas fa-trophy text-yellow-500 ml-1"></i>' : ''}
          </div>
        </div>
      `;
      return card;
    }

    carregarTurmaLocal();
    carregarJogos();
    setInterval(carregarJogos, 10000);
  </script>
</body>
</html>
