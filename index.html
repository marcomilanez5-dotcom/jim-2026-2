<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JIM 2026.2 — Central do Torcedor</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .bg-cacique { background-color: #0F172A; }
    @keyframes pulse-red {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .pulse-live { animation: pulse-red 1.5s infinite; }
    .badge-novo { animation: pulse 2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .jogo-destaque {
      border: 2px solid #FCD34D !important;
      background-color: #FFFBEB !important;
      box-shadow: 0 0 10px rgba(252, 211, 77, 0.3);
    }
    .vitoria {
      background-color: #DCFCE7 !important;
      border-color: #22C55E !important;
    }
    .derrota {
      background-color: #FEE2E2 !important;
      border-color: #EF4444 !important;
    }
    .card-ouro {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
      border: 1.5px solid #FCD34D;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-16">

  <!-- BANNER DE AVISO DA DIRETORIA -->
  <div id="bannerAviso" class="hidden bg-amber-400 text-amber-950 px-4 py-2 text-xs sm:text-sm font-bold text-center border-b border-amber-500 shadow-sm flex items-center justify-center gap-2">
    <i class="fas fa-bullhorn text-amber-900 animate-bounce"></i>
    <span id="textoAviso"></span>
  </div>

  <!-- HEADER -->
  <header class="bg-cacique text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i class="fas fa-trophy text-yellow-400 text-xl"></i>
        <div>
          <h1 class="text-lg font-bold tracking-wide leading-none">JIM 2026.2 — AAAMCTN</h1>
          <p class="text-xs text-gray-400">Acompanhamento Ao Vivo</p>
        </div>
      </div>
            <div class="flex items-center gap-2.5">
        <a href="/watch.html" title="Modo Apple Watch / Smartwatch" 
           class="bg-slate-800 hover:bg-slate-700 text-yellow-400 px-2.5 py-1 rounded-lg text-xs font-bold border border-slate-700 flex items-center gap-1 shadow-sm transition">
          <i class="fas fa-clock"></i>
          <span class="hidden sm:inline">Watch</span>
        </a>
        <div class="text-right text-xs text-gray-300 flex items-center gap-1.5">
          <span class="hidden sm:inline">🔄 Ao Vivo</span>
          <i class="fas fa-sync-alt fa-spin text-blue-400"></i>
        </div>
      </div>
    </div>

    <!-- ABAS DE NAVEGAÇÃO SUPERIOR -->
    <div class="max-w-4xl mx-auto mt-3 flex gap-2">
      <button id="btnAbaJogos" onclick="trocarAbaPrincipal('jogos')" 
              class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5 transition">
        <i class="fas fa-futbol"></i>
        <span>Jogos & Tabela</span>
      </button>
      <button id="btnAbaCampeoes" onclick="trocarAbaPrincipal('campeoes')" 
              class="flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg bg-slate-800 text-gray-300 hover:text-white flex items-center justify-center gap-1.5 transition border border-slate-700">
        <i class="fas fa-crown text-yellow-400"></i>
        <span>Campeões do Dia</span>
        <span id="badgeNumCampeoes" class="hidden ml-1 px-1.5 py-0.2 bg-yellow-500 text-slate-900 text-[10px] font-black rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- ================= ABA 1: JOGOS & CONFRONTOS ================= -->
  <main id="secaoAbaJogos" class="max-w-4xl mx-auto p-4 space-y-6">

    <!-- PRÓXIMOS JOGOS -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
      <h2 class="text-sm font-bold uppercase tracking-wider text-gray-700 mb-3 flex items-center gap-2">
        <i class="fas fa-clock text-blue-600"></i> Próximos Jogos da Sua Turma (Ordem Cronológica)
      </h2>
      <div id="proximosJogos" class="space-y-2">
        <p class="text-gray-500 text-sm">Selecione sua turma para ver os próximos jogos</p>
      </div>
    </section>

    <!-- JOGOS AO VIVO -->
    <section id="secaoAoVivo" class="hidden">
      <div class="bg-red-50 border border-red-200 rounded-xl p-4 shadow-sm">
        <div class="flex items-center gap-2 mb-3">
          <span class="w-3 h-3 bg-red-600 rounded-full pulse-live"></span>
          <h2 class="text-sm font-bold uppercase tracking-wider text-red-700">Acontecendo Agora</h2>
        </div>
        <div id="cardsAoVivo" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </section>

    <!-- FILTROS -->
    <section class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
      <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-1">Filtrar Confrontos</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Modalidade</label>
          <select id="filterModalidade" onchange="renderAll()" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm font-semibold text-gray-800">
            <option value="Todas">Todas as Modalidades</option>
            <option value="Futebol Sete Masc">Futebol Sete Masc</option>
            <option value="Futebol Sete Fem">Futebol Sete Fem</option>
            <option value="Vôlei Masc">Vôlei Masc</option>
            <option value="Vôlei Fem">Vôlei Fem</option>
            <option value="Beach Tennis">Beach Tennis</option>
            <option value="Tênis Masc">Tênis Masc</option>
            <option value="Tênis Fem">Tênis Fem</option>
            <option value="Sinuca">Sinuca</option>
            <option value="Pebolim">Pebolim</option>
            <option value="FIFA">FIFA</option>
            <option value="Xadrez">Xadrez</option>
            <option value="Truco Gaudério">Truco Gaudério</option>
            <option value="Truco Paulista">Truco Paulista</option>
            <option value="Jogos Alcoólicos">Jogos Alcoólicos</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">Sua Turma</label>
          <select id="filterTurma" onchange="salvarTurmaLocal(); renderAll()" class="w-full p-2 bg-gray-50 border border-gray-300 rounded-lg text-sm font-semibold text-gray-800 border-blue-400">
            <option value="Todas">Todas as Turmas</option>
            <option value="46">Turma 46</option>
            <option value="47A">Turma 47A</option>
            <option value="47B">Turma 47B</option>
            <option value="47C">Turma 47C</option>
            <option value="48A">Turma 48A</option>
            <option value="48B">Turma 48B</option>
            <option value="48C">Turma 48C</option>
            <option value="49A">Turma 49A</option>
            <option value="49B">Turma 49B</option>
            <option value="49C">Turma 49C</option>
            <option value="50A">Turma 50A</option>
            <option value="50B">Turma 50B</option>
            <option value="50C">Turma 50C</option>
          </select>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 pt-1" id="grupoBotoesDias">
        <button onclick="setDia('Todos')" id="btnDiaTodos" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Todos os Dias</button>
        <button onclick="setDia('Quinta')" id="btnDiaQuinta" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Quinta</button>
        <button onclick="setDia('Sexta')" id="btnDiaSexta" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Sexta</button>
        <button onclick="setDia('Sábado')" id="btnDiaSabado" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Sábado</button>
        <button onclick="setDia('Domingo')" id="btnDiaDomingo" class="btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Domingo</button>
      </div>
    </section>

    <!-- LISTA DE TODOS OS CONFRONTOS -->
    <section>
      <div id="listaJogos" class="grid grid-cols-1 gap-3"></div>
    </section>
  </main>

  <!-- ================= ABA 2: GALERIA DE CAMPEÕES DO DIA ================= -->
  <main id="secaoAbaCampeoes" class="max-w-4xl mx-auto p-4 space-y-6 hidden">
    
    <div class="bg-gradient-to-r from-amber-500 to-yellow-600 rounded-2xl p-5 text-white shadow-lg flex items-center justify-between">
      <div>
        <h2 class="text-xl font-black flex items-center gap-2">
          <i class="fas fa-medal text-yellow-200 text-2xl"></i>
          <span>Galeria de Campeões</span>
        </h2>
        <p class="text-xs text-yellow-100 mt-0.5">Modalidades encerradas e os detentores dos troféus do JIM 2026.2!</p>
      </div>
      <span class="text-3xl">🏆</span>
    </div>

    <!-- SELETOR DE DIA DOS CAMPEÕES -->
    <div class="flex flex-wrap gap-2">
      <button onclick="setDiaCampeoes('Todos')" id="btnCampTodos" class="btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm">Todos os Dias</button>
      <button onclick="setDiaCampeoes('Quinta')" id="btnCampQuinta" class="btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-white border text-gray-700 hover:bg-gray-50">Quinta</button>
      <button onclick="setDiaCampeoes('Sexta')" id="btnCampSexta" class="btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-white border text-gray-700 hover:bg-gray-50">Sexta</button>
      <button onclick="setDiaCampeoes('Sábado')" id="btnCampSabado" class="btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-white border text-gray-700 hover:bg-gray-50">Sábado</button>
      <button onclick="setDiaCampeoes('Domingo')" id="btnCampDomingo" class="btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-white border text-gray-700 hover:bg-gray-50">Domingo</button>
    </div>

    <!-- LISTA DE CARDS DE CAMPEÕES -->
    <div id="containerCampeoes" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwltAE6CbhINH_jf3S00QrXg05R_Ubz-eDOmKtY338vBkAf8hf4iJ46o47KGiGF17JM/exec?modo=json";
    let jogosData = [];
    let diaSelecionado = "Todos";
    let diaCampeoesSelecionado = "Todos";
    let turmaLocal = localStorage.getItem('jimTurma') || "Todas";
    let carregando = false;

    function trocarAbaPrincipal(aba) {
      const secaoJogos = document.getElementById("secaoAbaJogos");
      const secaoCampeoes = document.getElementById("secaoAbaCampeoes");
      const btnJogos = document.getElementById("btnAbaJogos");
      const btnCampeoes = document.getElementById("btnAbaCampeoes");

      if (aba === 'jogos') {
        secaoJogos.classList.remove("hidden");
        secaoCampeoes.classList.add("hidden");
        btnJogos.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg bg-blue-600 text-white shadow-sm flex items-center justify-center gap-1.5 transition";
        btnCampeoes.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg bg-slate-800 text-gray-300 hover:text-white flex items-center justify-center gap-1.5 transition border border-slate-700";
      } else {
        secaoJogos.classList.add("hidden");
        secaoCampeoes.classList.remove("hidden");
        btnCampeoes.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg bg-yellow-500 text-slate-900 shadow-md flex items-center justify-center gap-1.5 transition";
        btnJogos.className = "flex-1 py-2 text-xs sm:text-sm font-bold rounded-lg bg-slate-800 text-gray-300 hover:text-white flex items-center justify-center gap-1.5 transition border border-slate-700";
        renderCampeoes();
      }
    }

    function definirDiaAtualAutomatico() {
      const hoje = new Date().getDay(); 
      if (hoje === 4) diaSelecionado = "Quinta";
      else if (hoje === 5) diaSelecionado = "Sexta";
      else if (hoje === 6) diaSelecionado = "Sábado";
      else if (hoje === 0) diaSelecionado = "Domingo";
      else diaSelecionado = "Todos";

      atualizarCoresBotoesDia();
    }

    function atualizarCoresBotoesDia() {
      document.querySelectorAll(".btn-dia").forEach(btn => {
        if (btn.innerText.includes(diaSelecionado) || (diaSelecionado === "Todos" && btn.innerText.includes("Todos"))) {
          btn.className = "btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm";
        } else {
          btn.className = "btn-dia px-3 py-1.5 text-xs font-bold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200";
        }
      });
    }

    function setDiaCampeoes(dia) {
      diaCampeoesSelecionado = dia;
      document.querySelectorAll(".btn-camp").forEach(btn => {
        if (btn.innerText.includes(dia) || (dia === "Todos" && btn.innerText.includes("Todos"))) {
          btn.className = "btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-600 text-white shadow-sm";
        } else {
          btn.className = "btn-camp px-3 py-1.5 text-xs font-bold rounded-lg bg-white border text-gray-700 hover:bg-gray-50";
        }
      });
      renderCampeoes();
    }

    function obterPesoCronologico(j) {
      const h = String(j.horario || "").toLowerCase();
      let pesoDia = 99;

      if (h.includes("quinta")) pesoDia = 1;
      else if (h.includes("sexta")) pesoDia = 2;
      else if (h.includes("sábado") || h.includes("sabado")) pesoDia = 3;
      else if (h.includes("domingo")) pesoDia = 4;

      const matchHora = h.match(/(\d{1,2}):(\d{2})/);
      let horaDecimal = 0;
      if (matchHora) {
        horaDecimal = parseInt(matchHora[1], 10) + (parseInt(matchHora[2], 10) / 60);
      }

      return (pesoDia * 100) + horaDecimal;
    }

    async function carregarJogos() {
      if (carregando) return;
      carregando = true;
      try {
        const resp = await fetch(API_URL, { cache: "no-store" });
        const data = await resp.json();
        jogosData = data.jogos || [];

        const banner = document.getElementById("bannerAviso");
        const textoAviso = document.getElementById("textoAviso");
        if (data.aviso && data.aviso.trim() !== "") {
          textoAviso.innerText = data.aviso;
          banner.classList.remove("hidden");
        } else {
          banner.classList.add("hidden");
        }

        renderAll();
        atualizarBadgeCampeoes();
      } catch (err) {
        console.error("Erro ao carregar jogos:", err);
      } finally {
        carregando = false;
      }
    }

    function salvarTurmaLocal() {
      const turma = document.getElementById("filterTurma").value;
      localStorage.setItem('jimTurma', turma);
      turmaLocal = turma;
    }

    function carregarTurmaLocal() {
      const turma = localStorage.getItem('jimTurma');
      if (turma) {
        document.getElementById("filterTurma").value = turma;
        turmaLocal = turma;
      }
    }

    function setDia(dia) {
      diaSelecionado = dia;
      atualizarCoresBotoesDia();
      renderAll();
    }

    function renderAll() {
      renderAoVivo();
      renderProximosJogos();
      renderJogos();
      renderCampeoes();
    }

    function renderProximosJogos() {
      const container = document.getElementById("proximosJogos");
      container.innerHTML = "";

      if (turmaLocal === "Todas") {
        container.innerHTML = "<p class='text-gray-500 text-sm'>Selecione sua turma para ver próximos jogos</p>";
        return;
      }

      const proximosJogos = jogosData.filter(j => {
        const t1 = String(j.t1).trim().toLowerCase();
        const t2 = String(j.t2).trim().toLowerCase();
        const turmaBusca = String(turmaLocal).trim().toLowerCase();
        const isMinhaTurma = t1 === turmaBusca || t2 === turmaBusca || t1.includes(turmaBusca) || t2.includes(turmaBusca);
        return isMinhaTurma && (j.status === "Acontecerá" || j.status === "Em breve");
      });

      proximosJogos.sort((a, b) => obterPesoCronologico(a) - obterPesoCronologico(b));

      const proximosTres = proximosJogos.slice(0, 3);

      if (proximosTres.length === 0) {
        container.innerHTML = "<p class='text-gray-500 text-sm'>Nenhum jogo futuro agendado para esta turma.</p>";
        return;
      }

      proximosTres.forEach(j => {
        const card = document.createElement("div");
        card.className = "bg-gradient-to-r from-blue-50 to-blue-100 border border-blue-300 p-3 rounded-lg shadow-sm";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-sm text-blue-900">${j.modalidade}</span>
            <span class="text-xs text-blue-800 font-semibold bg-white/70 px-2 py-0.5 rounded">${j.horario || "A definir"}${j.local ? " • " + j.local : ""}</span>
          </div>
          <div class="flex items-center justify-between">
            <div class="font-bold text-sm text-gray-800">${j.t1}</div>
            <div class="text-xs text-gray-500 font-bold uppercase">vs</div>
            <div class="font-bold text-sm text-gray-800">${j.t2}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderAoVivo() {
      const container = document.getElementById("cardsAoVivo");
      const secao = document.getElementById("secaoAoVivo");
      container.innerHTML = "";
      const emAndamento = jogosData.filter(j => j.status === "Em Andamento" || j.status === "Ao Vivo");
      if (emAndamento.length > 0) {
        secao.classList.remove("hidden");
        emAndamento.forEach(j => {
          container.appendChild(criarCardJogo(j, true));
        });
      } else {
        secao.classList.add("hidden");
      }
    }

    function renderJogos() {
      const container = document.getElementById("listaJogos");
      const mod = document.getElementById("filterModalidade").value;
      container.innerHTML = "";

      const jogosFiltrados = jogosData.filter(j => {
        const matchMod = mod === "Todas" || j.modalidade === mod;
        const t1Str = String(j.t1 || "").trim().toLowerCase();
        const t2Str = String(j.t2 || "").trim().toLowerCase();
        const turmaBusca = String(turmaLocal).trim().toLowerCase();
        const matchTurma = turmaLocal === "Todas" || t1Str === turmaBusca || t2Str === turmaBusca || t1Str.includes(turmaBusca) || t2Str.includes(turmaBusca);
        const matchDia = diaSelecionado === "Todos" || (j.horario && String(j.horario).toLowerCase().includes(diaSelecionado.toLowerCase()));
        return matchMod && matchTurma && matchDia;
      });

      if (!jogosFiltrados.length) {
        container.innerHTML = `<div class="text-center text-gray-500 py-10 bg-white rounded-xl shadow-sm border">Nenhum jogo encontrado para estes filtros.</div>`;
        return;
      }

      jogosFiltrados.sort((a, b) => obterPesoCronologico(a) - obterPesoCronologico(b));

      jogosFiltrados.forEach(j => {
        container.appendChild(criarCardJogo(j, false));
      });
    }

    function extrairDiaJogo(j) {
      const h = String(j.horario || "").toLowerCase();
      if (h.includes("quinta")) return "Quinta";
      if (h.includes("sexta")) return "Sexta";
      if (h.includes("sábado") || h.includes("sabado")) return "Sábado";
      if (h.includes("domingo")) return "Domingo";
      return "Outros";
    }

    function atualizarBadgeCampeoes() {
      const finaisEncerradas = jogosData.filter(j => 
        String(j.fase || "").toLowerCase().includes("final") && j.status === "Encerrado" && (j.p1 !== j.p2)
      );
      const badge = document.getElementById("badgeNumCampeoes");
      if (finaisEncerradas.length > 0) {
        badge.innerText = finaisEncerradas.length;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }

    function renderCampeoes() {
      const container = document.getElementById("containerCampeoes");
      if (!container) return;
      container.innerHTML = "";

      const finaisEncerradas = jogosData.filter(j => {
        const ehFinal = String(j.fase || "").toLowerCase().includes("final");
        const enc = j.status === "Encerrado";
        const temVencedor = Number(j.p1) !== Number(j.p2);
        const dia = extrairDiaJogo(j);
        const matchDia = (diaCampeoesSelecionado === "Todos" || dia === diaCampeoesSelecionado);

        return ehFinal && enc && temVencedor && matchDia;
      });

      if (finaisEncerradas.length === 0) {
        container.innerHTML = `
          <div class="col-span-full bg-white p-8 rounded-2xl border border-gray-200 text-center space-y-2 shadow-sm">
            <div class="text-4xl">⏳</div>
            <h3 class="font-bold text-gray-800 text-base">Nenhum campeão consagrado ainda${diaCampeoesSelecionado !== 'Todos' ? ' para ' + diaCampeoesSelecionado : ''}!</h3>
            <p class="text-xs text-gray-500">Assim que as partidas finais forem encerradas no painel, os títulos aparecerão aqui automaticamente.</p>
          </div>
        `;
        return;
      }

      finaisEncerradas.forEach(j => {
        const campeao = j.p1 > j.p2 ? j.t1 : j.t2;
        const vice = j.p1 > j.p2 ? j.t2 : j.t1;
        const dia = extrairDiaJogo(j);

        const card = document.createElement("div");
        card.className = "card-ouro p-4 rounded-2xl shadow-md flex flex-col justify-between gap-3 relative overflow-hidden";

        card.innerHTML = `
          <!-- CABEÇALHO COM MODALIDADE E DIA -->
          <div class="flex justify-between items-center border-b border-amber-200 pb-2">
            <div>
              <span class="text-xs font-black uppercase text-amber-900 bg-amber-200/60 px-2.5 py-0.5 rounded-md">${j.modalidade}</span>
              <span class="text-[11px] font-bold text-amber-800 ml-1.5"><i class="far fa-calendar-alt mr-1"></i>${dia}</span>
            </div>
            <span class="text-xs font-black text-amber-700 bg-white/80 px-2 py-0.5 rounded-full border border-amber-300 shadow-xs">OFICIAL</span>
          </div>

          <!-- PÓDIO (SEM PONTUAÇÃO EMBAIXO) -->
          <div class="grid grid-cols-2 gap-2 my-1">
            <!-- 1º LUGAR (CAMPEÃO) -->
            <div class="bg-white/90 p-3.5 rounded-xl border-2 border-yellow-400 shadow-sm text-center relative flex flex-col justify-center">
              <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-yellow-400 text-amber-950 text-[10px] font-black uppercase px-2 py-0.2 rounded-full shadow-xs">
                🥇 CAMPEÃO
              </span>
              <div class="text-xl font-black text-amber-950 mt-1">${campeao}</div>
            </div>

            <!-- 2º LUGAR (VICE) -->
            <div class="bg-white/60 p-3.5 rounded-xl border border-gray-300 text-center relative flex flex-col justify-center">
              <span class="absolute -top-2.5 left-1/2 -translate-x-1/2 bg-gray-300 text-gray-800 text-[10px] font-black uppercase px-2 py-0.2 rounded-full shadow-xs">
                🥈 VICE
              </span>
              <div class="text-lg font-black text-gray-700 mt-1">${vice}</div>
            </div>
          </div>

          <!-- COMPARTILHAR TÍTULO -->
          <div class="flex justify-between items-center pt-2 border-t border-amber-200 text-xs">
            <span class="text-[10px] font-bold text-amber-800"><i class="fas fa-trophy mr-1 text-yellow-600"></i>Troféu Consagrado</span>
            <button onclick="compartilharCampeao('${j.modalidade}', '${campeao}', '${vice}', '${dia}')"
                    class="bg-green-600 hover:bg-green-700 text-white px-3 py-1 rounded-lg font-bold text-xs flex items-center gap-1.5 shadow-sm transition">
              <i class="fab fa-whatsapp"></i>
              <span>Compartilhar Título</span>
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function compartilharCampeao(modalidade, campeao, vice, dia) {
      let texto = `🏆🦈 *É CAMPEÃO NO JIM 2026.2!* 🦈🏆\n\n`;
      texto += `🥇 *${campeao}* acaba de conquistar o título de *${modalidade}* (${dia})!\n`;
      texto += `🥈 Vice: ${vice}\n\n`;
      texto += `📲 Confira todos os campeões e placares ao vivo:\n`;
      texto += `https://jim-2026-2.vercel.app/`;

      const urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(urlWhatsApp, '_blank');
    }

    function compartilharWhatsApp(modalidade, t1, t2, p1, p2, status, horario, local) {
      let texto = `🏆 *JIM 2026.2 — AAAMCTN*\n`;
      texto += `⚽ *${modalidade}*\n\n`;

      if (status === "Encerrado") {
        texto += `🏁 *FIM DE JOGO!*\n`;
        texto += `👉 *${t1}* ${p1} x ${p2} *${t2}*\n\n`;
      } else if (status === "Em Andamento" || status === "Ao Vivo") {
        texto += `🔴 *ROLANDO AGORA!*\n`;
        texto += `👉 *${t1}* ${p1} x ${p2} *${t2}*\n\n`;
      } else {
        texto += `⏳ *PRÓXIMO CONFRONTO:*\n`;
        texto += `👉 *${t1}* vs *${t2}*\n`;
        texto += `⏰ ${horario || 'Horário a definir'}${local ? ' • ' + local : ''}\n\n`;
      }

      texto += `📲 Acompanhe todos os placares ao vivo:\n`;
      texto += `https://jim-2026-2.vercel.app/`;

      const urlWhatsApp = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
      window.open(urlWhatsApp, '_blank');
    }

    function criarCardJogo(j, isLive) {
      const enc = j.status === 'Encerrado';
      const aoVivo = j.status === 'Em Andamento' || j.status === 'Ao Vivo';
      
      const t1Str = String(j.t1).trim().toLowerCase();
      const t2Str = String(j.t2).trim().toLowerCase();
      const turmaBusca = String(turmaLocal).trim().toLowerCase();
      
      const souTime1 = turmaLocal !== "Todas" && (t1Str === turmaBusca || t1Str.includes(turmaBusca));
      const souTime2 = turmaLocal !== "Todas" && (t2Str === turmaBusca || t2Str.includes(turmaBusca));
      const isMinhaTurma = souTime1 || souTime2;

      const time1Venceu = enc && j.p1 > j.p2;
      const time2Venceu = enc && j.p2 > j.p1;

      let minhaTurmaVenceu = false;
      let minhaTurmaPerdeu = false;

      if (isMinhaTurma && enc) {
        if ((souTime1 && time1Venceu) || (souTime2 && time2Venceu)) {
          minhaTurmaVenceu = true;
        } else if ((souTime1 && time2Venceu) || (souTime2 && time1Venceu)) {
          minhaTurmaPerdeu = true;
        }
      }

      let classDestaque = "";
      if (aoVivo) {
        classDestaque = "border-red-400 bg-red-50";
      } else if (minhaTurmaVenceu) {
        classDestaque = "vitoria jogo-destaque";
      } else if (minhaTurmaPerdeu) {
        classDestaque = "derrota jogo-destaque";
      } else if (isMinhaTurma) {
        classDestaque = "jogo-destaque";
      }

      const card = document.createElement("div");
      card.className = `bg-white p-4 rounded-xl shadow-sm border border-gray-200 ${classDestaque}`;

      let badgeNovo = "";
      if (aoVivo) {
        badgeNovo = `<span class="badge-novo text-xs font-bold bg-red-500 text-white px-2 py-1 rounded-full ml-2">🔴 AO VIVO</span>`;
      } else if (enc) {
        badgeNovo = `<span class="badge-novo text-xs font-bold bg-green-500 text-white px-2 py-1 rounded-full ml-2">✓ ENCERRADO</span>`;
      }

      card.innerHTML = `
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-bold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md">${j.modalidade}</span>
          <div class="flex items-center">
            <span class="text-xs font-semibold ${aoVivo ? 'text-red-600 bg-red-50 px-2 py-0.5 rounded' : (enc ? (j.fase || 'Encerrado') : 'text-amber-600 bg-amber-50 px-2 py-0.5 rounded')}">
              ${aoVivo ? 'AO VIVO' : (enc ? (j.fase || 'Encerrado') : (j.horario || 'Em breve'))}
            </span>
            ${j.local ? `<span class="text-xs text-gray-500 ml-2"><i class="fas fa-map-marker-alt mr-1"></i>${j.local}</span>` : ''}
            ${badgeNovo}
          </div>
        </div>

        <div class="flex items-center justify-between bg-gray-50 p-3 rounded-lg mt-2">
          <div class="w-5/12 text-center font-bold text-sm ${time1Venceu ? 'text-green-700 font-extrabold' : 'text-gray-800'}">
            ${time1Venceu ? '<i class="fas fa-trophy text-yellow-500 mr-1"></i>' : ''} ${j.t1}
          </div>

          <div class="w-2/12 flex items-center justify-center gap-1.5 font-extrabold text-lg">
            <span class="${time1Venceu ? 'text-green-600 text-xl' : 'text-gray-700'}">${j.p1}</span>
            <span class="text-gray-400 font-normal">x</span>
            <span class="${time2Venceu ? 'text-green-600 text-xl' : 'text-gray-700'}">${j.p2}</span>
          </div>

          <div class="w-5/12 text-center font-bold text-sm ${time2Venceu ? 'text-green-700 font-extrabold' : 'text-gray-800'}">
            ${j.t2} ${time2Venceu ? '<i class="fas fa-trophy text-yellow-500 ml-1"></i>' : ''}
          </div>
        </div>

        <!-- BOTÃO COMPARTILHAR WHATSAPP -->
        <div class="flex justify-end mt-2 pt-2 border-t border-gray-100">
          <button onclick="compartilharWhatsApp('${j.modalidade}', '${j.t1}', '${j.t2}', ${j.p1}, ${j.p2}, '${j.status}', '${j.horario || ''}', '${j.local || ''}')" 
                  class="text-[11px] font-bold text-green-700 hover:text-green-800 bg-green-50 hover:bg-green-100 px-2.5 py-1 rounded-lg transition flex items-center gap-1.5 shadow-sm">
            <i class="fab fa-whatsapp text-green-600 text-sm"></i>
            <span>Compartilhar</span>
          </button>
        </div>
      `;
      return card;
    }

    // Inicialização
    definirDiaAtualAutomatico();
    carregarTurmaLocal();
    carregarJogos();
    setInterval(carregarJogos, 10000);
  </script>
</body>
